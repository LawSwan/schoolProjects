<!DOCTYPE html>
<html>
   <head>
      <!--
         Author: Amber Lawson
         Date:   April 25, 2026
         Purpose: This secondary window displays a math table (addition or
                  multiplication) based on the type parameter passed in the URL.
      -->
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>Math Table Display</title>
      <style>
         body {
            font-family: Georgia, serif;
            padding: 20px;
            margin: 0;
         }
         h1 {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
         }
         table {
            border-collapse: collapse;
         }
         th, td {
            border: 1px solid black;
            padding: 5px 10px;
            text-align: center;
            min-width: 30px;
         }
         th {
            font-weight: bold;
         }
      </style>
   </head>
   <body>
      <!-- Header will be set by JavaScript -->
      <h1 id="tableHeader"></h1>

      <!-- Table will be generated by JavaScript -->
      <table id="mathTable"></table>

      <script>
         // Get the type parameter from the URL
         const urlParams = new URLSearchParams(window.location.search);
         const type = urlParams.get("type");

         // Determine the title based on type
         const title = type === "addition" ? "Addition Table" : "Multiplication Table";

         // Set the header text
         document.getElementById("tableHeader").textContent = "Amber Lawson, " + title;

         // Get the table element
         const table = document.getElementById("mathTable");

         // Create header row
         let headerRow = "<tr><th></th>";
         for (let i = 0; i <= 10; i++) {
            headerRow += "<th>" + i + "</th>";
         }
         headerRow += "</tr>";
         table.innerHTML = headerRow;

         // Create table rows (0-10)
         for (let row = 0; row <= 10; row++) {
            let tableRow = "<tr><th>" + row + "</th>";

            // Calculate each cell value
            for (let col = 0; col <= 10; col++) {
               let result;
               if (type === "addition") {
                  // Addition: row + column
                  result = row + col;
               } else {
                  // Multiplication: row × column
                  result = row * col;
               }
               tableRow += "<td>" + result + "</td>";
            }
            tableRow += "</tr>";
            table.innerHTML += tableRow;
         }
      </script>
   </body>
</html>
